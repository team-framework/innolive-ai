# BoT-SORT settings tuned for stable segmentation masks in a real-time video stream.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.05
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.80
fuse_score: true

# Camera motion compensation keeps IDs stable when the camera itself moves.
gmc_method: sparseOptFlow
# Frame downscale for motion compensation. It runs in the single inference lane every frame,
# so 4 (ultralytics default is 2) quarters the optical-flow pixels.
gmc_downscale: 4

# ReID adds another model and synchronization point. Motion + IoU association is
# faster for the short face occlusions handled by mask_hold_frames.
proximity_thresh: 0.50
appearance_thresh: 0.80
with_reid: false
model: auto
