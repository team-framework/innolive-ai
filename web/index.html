<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InnoLive gRPC ProcessVideo Demo</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">INNOLIVE · GRPC LIVE DEMO</p>
        <h1>실시간 얼굴 비식별화</h1>
      </div>
      <strong id="status" data-online="false">보호 결과 대기 중</strong>
    </header>

    <main>
      <section class="panel enrollment">
        <div class="section-heading">
          <div>
            <h2>화이트리스트 얼굴 등록</h2>
          </div>
          <label class="active-session-control">
            <span>현재 세션</span>
            <select id="session-id" disabled>
              <option value="">세션 목록 확인 중</option>
            </select>
          </label>
        </div>

        <input id="whitelist-files" class="visually-hidden" type="file" accept="image/*" multiple />
        <div id="whitelist-dropzone" class="upload-zone" role="button" tabindex="0" aria-controls="whitelist-files">
          <span class="upload-icon" aria-hidden="true">↑</span>
          <strong>얼굴 사진 선택 또는 드롭</strong>
        </div>
        <div class="selection-summary">
          <strong id="selected-file-summary">선택 파일 없음</strong>
          <span id="whitelist-status">서버 세션 준비 중</span>
        </div>
        <div class="whitelist-entries-wrap">
          <strong>등록된 얼굴</strong>
          <div id="whitelist-entries" class="whitelist-entries" aria-live="polite">
            <span class="empty-entry">없음</span>
          </div>
        </div>
        <ul id="enrollment-results" class="file-results" aria-live="polite" hidden></ul>
        <div class="enrollment-actions">
          <button id="add-whitelist" class="primary" disabled>얼굴 등록</button>
        </div>
      </section>

      <section class="controls panel">
        <button id="start" disabled>카메라 시작</button>
        <button id="stop" disabled>중지</button>
      </section>

      <section class="viewers">
        <article class="panel danger">
          <h2>원본 <em>보호되지 않음</em></h2>
          <video id="source" autoplay muted playsinline></video>
        </article>
        <article class="panel protected">
          <h2>보호 출력</h2>
          <canvas id="output" width="640" height="360"></canvas>
        </article>
      </section>

      <section class="metrics panel" aria-label="pipeline metrics">
        <div><span>Capture FPS</span><strong id="capture-fps">0</strong></div>
        <div><span>Result FPS</span><strong id="result-fps">0</strong></div>
        <div><span>Displayed FPS</span><strong id="display-fps">0</strong></div>
      </section>

      <section class="panel session-management">
        <div class="section-heading session-heading">
          <div>
            <h2>세션 관리</h2>
          </div>
          <div class="session-actions">
            <button id="refresh-whitelist" disabled>새로고침</button>
            <button id="new-session" class="secondary" disabled>새 세션</button>
          </div>
        </div>
        <div id="session-list" class="session-list" aria-live="polite">
          <p class="empty-state">서버 세션 목록을 불러오는 중입니다.</p>
        </div>
      </section>
    </main>

    <canvas id="capture" hidden></canvas>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
