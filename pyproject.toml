[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["protos/ai_processor_pb2.py", "protos/ai_processor_pb2_grpc.py", "protos/ai_processor_pb2.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
