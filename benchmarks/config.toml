# Common benchmark configuration. CLI flags can override target and profile.
target = "127.0.0.1:50051"
proto = "protos/ai_processor.proto"
results_dir = "benchmark-results"
insecure = true
timeout = "30s"
duration_stop = "wait"
warmup_total = 3
monitor_interval_seconds = 0.25

[video]
# Video frames are sampled and JPEG-encoded before ghz starts, so decoding does
# not contaminate the measured load-generator runtime.
sample_fps = 10.0
max_frames = 300
jpeg_quality = 85

[server]
command = ["{python}", "ai_processor_server.py", "--host", "127.0.0.1", "--port", "50051"]
ready_timeout_seconds = 15

# A short correctness/performance check for local development.
[profiles.smoke]
duration = "2s"
concurrency = 2
connections = 1
stream_call_count = 3

# A repeatable local baseline. Run multiple times before comparing changes.
[profiles.baseline]
duration = "15s"
concurrency = 10
connections = 2
stream_call_count = 8

# A longer, higher-contention profile. Tune it to the target environment.
[profiles.stress]
duration = "60s"
concurrency = 50
connections = 10
stream_call_count = 16

# Plays one stream per worker at the sampled source rate. The local server is
# switched to passthrough so this measures communication rather than grayscale.
[profiles.video_realtime]
total = 2
concurrency = 2
connections = 2
stream_call_count = 1
video_pacing = "source"
server_args = ["--processing-mode", "passthrough"]

# Sends sampled video frames without pacing to find transport saturation.
[profiles.video_transport]
duration = "15s"
concurrency = 10
connections = 5
stream_call_count = 1
video_pacing = "none"
server_args = ["--processing-mode", "passthrough"]

# Same real-time video workload with the normal grayscale processing enabled.
[profiles.video_e2e]
total = 2
concurrency = 2
connections = 2
stream_call_count = 1
video_pacing = "source"

[[scenarios]]
name = "add_whitelist"
call = "AiProcessor.AddWhitelist"
kind = "unary"
payload_file = "dh.jpg"
payload_field = "data"

[scenarios.thresholds]
max_error_rate = 0.0

[[scenarios]]
name = "process_video"
call = "AiProcessor.ProcessVideo"
kind = "bidi_stream"
payload_file = "dh.jpg"
payload_field = "data"
timestamp_field = "timestamp"
stream_interval = "0s"

[scenarios.thresholds]
max_error_rate = 0.0
